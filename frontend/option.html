<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Dashboard</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:"Segoe UI", Arial, sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#1c1c1c);
  background-size:400% 400%;
  animation:gradientMove 10s ease infinite;
  padding:20px;
  color:#fff;
}

@keyframes gradientMove{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

h1{
  font-size:2.8rem;
  margin-bottom:40px;
  letter-spacing:2px;
  text-transform:uppercase;
  background:linear-gradient(90deg,#00f2fe,#4facfe);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:fadeDown 1s ease forwards;
}

@keyframes fadeDown{
  from{opacity:0; transform:translateY(-30px);}
  to{opacity:1; transform:translateY(0);}
}

.dashboard{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:30px;
  width:100%;
  max-width:900px;
}

.card{
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(15px);
  padding:35px;
  border-radius:20px;
  text-align:center;
  cursor:pointer;
  transition:0.4s ease;
  border:1px solid rgba(255,255,255,0.1);
  position:relative;
  overflow:hidden;
}

.card:hover{
  transform:translateY(-12px) scale(1.05);
  box-shadow:0 20px 40px rgba(0,0,0,0.6);
  border:1px solid #00f2fe;
}

.card a{
  text-decoration:none;
  font-size:1.3rem;
  font-weight:bold;
  letter-spacing:1px;
  color:#fff;
  transition:0.3s;
}

.card:hover a{
  color:#00f2fe;
}

.card::before{
  content:"";
  position:absolute;
  width:120%;
  height:120%;
  background:linear-gradient(45deg,transparent,#00f2fe,transparent);
  top:-100%;
  left:-100%;
  transform:rotate(25deg);
  transition:0.6s;
}

.card:hover::before{
  top:100%;
  left:100%;
}
</style>

</head>
<body>

<h1>Boss Control Panel</h1>

<div class="dashboard">
  <div class="card"><a href="https://customerchekcingsafty.free.nf/frontend/Boss.html">Eligibility</a></div>
  <div class="card"><a href="Boss.html">Loan System</a></div>
  <div class="card"><a href="https://special.free.nf/frontend/Boss.html">Special Loan System</a></div>
  <div class="card"><a href="https://creditmobile.fwh.is/frontend/Boss.html">Mobile System</a></div>
  <div class="card"><a href="https://saftych.kesug.com/frontend/Boss.html">Check Status</a></div>
  <div class="card"><a href="https://saftyceddkili.free.nf/frontend/Boss.html">Loan of Out Branch</a></div>
  <div class="card"><a href="https://productsafty.free.nf/frontend/Boss.html">Products</a></div>
  <div class="card"><a href="https://elgibilitysafty.free.nf/frontend/Boss.html">Eligibility</a></div>



</div>

</body>
</html>
