<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Segoe UI",Arial;}
body{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 background:linear-gradient(135deg,#1e3c72,#2a5298);
 padding:20px;
}

.wrapper{
 width:100%;
 max-width:900px;
 display:grid;
 grid-template-columns:1fr 1fr;
 background:#fff;
 border-radius:16px;
 overflow:hidden;
 box-shadow:0 18px 40px rgba(0,0,0,0.3);
}

.brand{
 background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
 color:#fff;
 padding:40px 30px;
 display:flex;
 flex-direction:column;
 justify-content:center;
}

.brand h1{text-align:center;margin-bottom:6px;font-size:26px;}
.brand p{text-align:center;font-size:14px;opacity:0.85;margin-bottom:28px;}

.branches{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:18px;
}

.branch{
 background:#fff;
 border-radius:14px;
 height:120px;
 padding:10px;
 display:flex;
 align-items:center;
 justify-content:center;
 box-shadow:0 6px 15px rgba(0,0,0,0.25);
}

.branch img{
 max-width:100%;
 max-height:100%;
 object-fit:contain;
 display:block;
}

.container{
 padding:45px 40px;
 display:flex;
 flex-direction:column;
 justify-content:center;
}

.container h2{text-align:center;margin-bottom:28px;color:#333;}

.container input{
 width:100%;
 padding:14px;
 margin-bottom:15px;
 border-radius:10px;
 border:1px solid #ccc;
 font-size:15px;
}

.container input:focus{
 outline:none;
 border-color:#3498db;
 box-shadow:0 0 0 3px rgba(52,152,219,0.25);
}

.container button{
 width:100%;
 padding:14px;
 background:#3498db;
 color:#fff;
 border:none;
 border-radius:10px;
 font-size:16px;
 cursor:pointer;
}

.container button:hover{
 background:#217dbb;
 transform:translateY(-2px);
}

#msg{
 margin-top:12px;
 text-align:center;
 font-size:14px;
 color:red;
}

@media(max-width:900px){
 .wrapper{grid-template-columns:1fr;}
 .brand{order:2;}
}

@media(max-width:500px){
 .branches{grid-template-columns:1fr;}
 .branch{height:140px;}
 .container{padding:30px 20px;}
}
</style>
</head>

<body>

<div class="wrapper">

<div class="brand">
<h1>Safteey Credit</h1>
<p>Authorized Admin Access</p>

<div class="branches">
<div class="branch"><img src="img/img1.png"></div>
<div class="branch"><img src="img/img2.jpg"></div>
<div class="branch"><img src="img/img3.jpg"></div>
</div>
</div>

<div class="container">
<h2>Admin Login</h2>

<input id="username" placeholder="Username">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Admin Login</button>





<p id="msg"></p>
</div>

</div>

<script>
function login() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value.trim();
  const msg = document.getElementById("msg");

  const now = new Date();
  const hour = now.getHours();    // 0-23
  const minute = now.getMinutes(); // 0-59

  // Time allowed: 9:00 AM (09:00) to 6:00 PM (18:00)
  const beforeStart = hour < 9;               // before 9:00 AM
  const afterEnd = hour > 18 || (hour === 18 && minute > 0); // after 6:00 PM

  if (beforeStart || afterEnd) {
    msg.style.color = "red";
    msg.innerText = "❌ Login allowed only between 9:00 AM and 6:00 PM";
    return;
  }

  if (username === "" || password === "") {
    msg.innerText = "❌ Enter username and password";
    return;
  }

  fetch("../api/admin_login.php", {
    method: "POST",
    headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body:
      "username=" + encodeURIComponent(username) +
      "&password=" + encodeURIComponent(password)
  })
  .then(r => r.json())
  .then(d => {
    if (d.status === "success") {
      msg.style.color = "green";
      msg.innerText = "✅ Login success";
      setTimeout(() => location = "dashboard.html", 800);
    } else {
      msg.style.color = "red";
      msg.innerText = "❌ " + (d.msg || "Invalid login");
    }
  })
  .catch(() => {
    msg.innerText = "❌ Server error";
  });
}
</script>

</body>
</html>
